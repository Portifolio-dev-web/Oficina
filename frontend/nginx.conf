server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Sem add_header aqui de propósito: a resposta é da API (JSON), que já
        # manda seu próprio CSP restrito (ver backend/server.py) — duplicar um
        # CSP pensado para HTML/JS neste location misturaria as duas políticas.
    }

    # Arquivos com hash no nome podem ser cacheados indefinidamente
    location /static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    }

    # index.html nunca deve ser cacheado para que novos deploys apareçam imediatamente
    location / {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        # SEGURANÇA (auditoria, item S5): não havia CSP nenhum — um XSS
        # qualquer conseguia ler o token do admin no localStorage e exfiltrar
        # para qualquer domínio. script-src sem 'unsafe-inline' exige que o
        # build do frontend não injete o runtime do webpack inline no HTML
        # (ver INLINE_RUNTIME_CHUNK=false no Dockerfile). style-src aceita
        # 'unsafe-inline' porque Tailwind/Framer Motion aplicam estilo via
        # atributo style (não executa código). images.unsplash.com e
        # fonts.google* ficam liberados enquanto a Home usar imagem do
        # Unsplash e a fonte do Google Fonts (ver roadmap da auditoria).
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https://images.unsplash.com; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
        try_files $uri $uri/ /index.html;
    }
}
